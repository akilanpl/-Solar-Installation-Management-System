name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solarops
          POSTGRES_PASSWORD: solarops
          POSTGRES_DB: solarops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U solarops -d solarops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SOLAROPS_APP_ENV: test
      SOLAROPS_DATABASE_URL: postgresql+psycopg://solarops:solarops@127.0.0.1:5432/solarops_test
      SOLAROPS_TEST_DATABASE_URL: postgresql+psycopg://solarops:solarops@127.0.0.1:5432/solarops_test
      SOLAROPS_SECRET_KEY: ci-secret-key-not-for-production-use!!
      SOLAROPS_COOKIE_SECURE: "false"
      SOLAROPS_TRUSTED_ORIGINS: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Create the disposable test database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "postgresql://solarops:solarops@127.0.0.1:5432/solarops" -c "CREATE DATABASE solarops_test OWNER solarops;"
      - name: Lint, migrate through pytest, and test
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run ruff check app tests scripts
          uv run pytest
      - name: OpenAPI matches the app
        working-directory: apps/api
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code -- ../../contracts/generated/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: |
          npm ci
          npm test
          npm run lint
          npm run generate:api
          git diff --exit-code -- src/generated/schema.ts
          npm run build
