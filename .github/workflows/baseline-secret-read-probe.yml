name: Immutable baseline credential read probe
on:
  workflow_call:
    secrets:
      probe_token:
        required: true
permissions: {}
jobs:
  read-only-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # No checkout, caller inputs/commands, cache, dependencies or artifacts.
      - name: Read the two owner pins without exposing credential or responses
        env:
          PROBE_TOKEN: ${{ secrets.probe_token }}
          EXPECTED_MAIN: ${{ vars.SOLAROPS_BASELINE_MAIN_SHA }}
          EXPECTED_CONTROLLER: ${{ vars.SOLAROPS_BASELINE_CONTROLLER_SHA }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request
          try:
              assert os.environ['GITHUB_REPOSITORY'] == 'akilanpl/-Solar-Installation-Management-System'
              assert os.environ['GITHUB_REPOSITORY_ID'] == '1440476764'
              token = os.environ['PROBE_TOKEN']
              assert token
              for name, expected in [('SOLAROPS_BASELINE_MAIN_SHA', os.environ['EXPECTED_MAIN']), ('SOLAROPS_BASELINE_CONTROLLER_SHA', os.environ['EXPECTED_CONTROLLER'])]:
                  assert re.fullmatch('[0-9a-f]{40}', expected)
                  request = urllib.request.Request('https://api.github.com/repos/akilanpl/-Solar-Installation-Management-System/actions/variables/'+name, headers={'Authorization': 'Bearer '+token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = json.load(response)
                  assert data['value'] == expected
              print('PASS: two read-only owner-pin API requests matched repository variables. No credential or response values were printed/stored; no write request was issued.')
          except Exception:
              print('FAIL: isolated credential read verification denied or mismatched. Credential and response values suppressed.')
              sys.exit(1)
          PY
