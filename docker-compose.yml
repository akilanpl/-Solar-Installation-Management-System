# Portable PostgreSQL 16 for machines that have Docker.
# This Mac's verified local alternative is Homebrew PostgreSQL 15 on port 5432.
# Do not run this compose file while that local server already owns port 5432.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: solarops
      POSTGRES_PASSWORD: solarops
      POSTGRES_DB: solarops_dev
    ports:
      - "5432:5432"
    volumes:
      - solarops_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarops -d solarops_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  solarops_pg:
