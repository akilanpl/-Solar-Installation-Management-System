[project]
name = "solarops-api"
version = "0.1.0"
description = "SolarOps Phase 1 API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "python-multipart>=0.0.20",
  "psycopg[binary]>=3.2.3",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34.0",
  "pillow>=12.0.0",
  "webauthn>=3.0.1",
  "pyotp>=2.9.0",
  "cryptography>=44.0.0",
]

[dependency-groups]
dev = [
  "coverage>=7.17.0",
  "pytest>=8.3.4",
  "pyyaml>=6.0.3",
  "ruff>=0.8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["database: requires the disposable PostgreSQL solarops_test database"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
