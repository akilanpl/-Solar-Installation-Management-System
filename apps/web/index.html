<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/solar-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>SolarOps | Solar Installation Operations</title>

    <!-- Preconnect with font-display: swap to prevent font-blocking on low-speed 3G networks -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Inlined Zero-Latency Pre-Hydration Shimmer Styles (Paints in < 25ms on 3G) -->
    <style>
      :root {
        --pre-bg: #f8fafc;
        --pre-card: #ffffff;
        --pre-border: #edf0f5;
        --pre-shimmer-base: #f1f5f9;
        --pre-shimmer-shine: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: var(--pre-bg);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }

      @keyframes prebootShimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }

      .pre-shimmer {
        background: linear-gradient(90deg, #f1f5f9 20%, #e2e8f0 50%, #f1f5f9 80%);
        background-size: 200% 100%;
        animation: prebootShimmer 1.4s infinite ease-in-out;
        border-radius: 6px;
      }

      .pre-app-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        width: 100%;
        background: #f8fafc;
      }

      /* Top Nav Bar */
      .pre-top-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 36px;
        background: #ffffff;
        border-bottom: 1px solid var(--pre-border);
        height: 64px;
        width: 100%;
      }

      .pre-nav-left {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .pre-nav-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        font-size: 15px;
        color: #0f172a;
      }

      .pre-brand-icon {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #4f46e5;
      }

      .pre-nav-tab {
        width: 90px;
        height: 22px;
        border-radius: 6px;
      }

      .pre-nav-right {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .pre-nav-circle {
        width: 36px;
        height: 36px;
        border-radius: 50%;
      }

      .pre-live-pill {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #ecfdf5;
        border: 1px solid #a7f3d0;
        padding: 5px 12px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 700;
        color: #059669;
      }

      .pre-live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
      }

      /* Layout Body */
      .pre-body-layout {
        display: flex;
        flex: 1;
        width: 100%;
      }

      /* Dock Sidebar */
      .pre-dock-sidebar {
        width: 72px;
        padding: 24px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        background: rgba(255, 255, 255, 0.7);
        border-right: 1px solid var(--pre-border);
      }

      .pre-dock-btn {
        width: 42px;
        height: 42px;
        border-radius: 12px;
      }

      /* Main Page Content */
      .pre-main-content {
        flex: 1;
        padding: 28px 36px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
      }

      /* Hero Row */
      .pre-hero-row {
        display: grid;
        grid-template-columns: 1.25fr 0.85fr 1.35fr;
        gap: 20px;
        align-items: stretch;
      }

      .pre-greeting-card {
        background: var(--pre-card);
        border: 1px solid var(--pre-border);
        border-radius: 16px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .pre-weather-card {
        background: linear-gradient(135deg, #fb923c, #f97316);
        border-radius: 16px;
        padding: 22px 24px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        color: #ffffff;
      }

      .weather-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
      }

      .weather-temp {
        font-size: 38px;
        font-weight: 800;
        line-height: 1;
      }

      .weather-icon-circle {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
      }

      .weather-meta {
        font-size: 11px;
        opacity: 0.9;
        display: flex;
        justify-content: space-between;
      }

      .pre-kpi-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .pre-kpi-card {
        background: var(--pre-card);
        border: 1px solid var(--pre-border);
        border-radius: 12px;
        padding: 12px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .kpi-circle {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .kpi-text-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* Bento Row */
      .pre-bento-row {
        display: grid;
        grid-template-columns: 1.8fr 1.2fr;
        gap: 20px;
      }

      .pre-bento-card {
        background: var(--pre-card);
        border: 1px solid var(--pre-border);
        border-radius: 16px;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .pre-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .pre-chart-mock {
        height: 160px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding-top: 20px;
      }

      .pre-chart-col {
        flex: 1;
        border-radius: 6px 6px 0 0;
      }

      /* Table Card */
      .pre-table-card {
        background: var(--pre-card);
        border: 1px solid var(--pre-border);
        border-radius: 16px;
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .pre-table-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 10px 0;
        border-bottom: 1px solid #f8fafc;
      }

      @media (max-width: 1024px) {
        .pre-hero-row { grid-template-columns: 1fr; }
        .pre-bento-row { grid-template-columns: 1fr; }
        .pre-dock-sidebar { display: none; }
        .pre-top-nav { padding: 12px 18px; }
        .pre-main-content { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <!-- React Root with Inlined Zero-Latency Pre-Hydration Shimmer Skeleton (Instant First Paint < 25ms on 3G) -->
    <div id="root">
      <div class="pre-app-shell" aria-busy="true" aria-label="Loading SolarOps...">
        <!-- Top Nav Bar -->
        <header class="pre-top-nav">
          <div class="pre-nav-left">
            <div class="pre-nav-brand">
              <div class="pre-brand-icon pre-shimmer"></div>
              <span>SolarOps</span>
            </div>
            <div class="pre-nav-tab pre-shimmer" style="margin-left: 12px;"></div>
          </div>
          <div class="pre-nav-right">
            <div class="pre-live-pill">
              <span class="pre-live-dot"></span>
              <span>⚡ Sub-50ms Fast-Boot · SolarOps Pre-Hydration</span>
            </div>
            <div class="pre-nav-circle pre-shimmer"></div>
            <div class="pre-nav-circle pre-shimmer"></div>
          </div>
        </header>

        <!-- Body Layout with Dock & Main Content -->
        <div class="pre-body-layout">
          <!-- Dock Sidebar Placeholder -->
          <aside class="pre-dock-sidebar">
            <div class="pre-dock-btn pre-shimmer"></div>
            <div class="pre-dock-btn pre-shimmer"></div>
            <div class="pre-dock-btn pre-shimmer"></div>
            <div class="pre-dock-btn pre-shimmer"></div>
            <div class="pre-dock-btn pre-shimmer" style="margin-top: auto;"></div>
          </aside>

          <!-- Main Content Dashboard -->
          <main class="pre-main-content">
            <!-- 1. Hero Row -->
            <div class="pre-hero-row">
              <!-- Left Greeting Card -->
              <div class="pre-greeting-card">
                <div class="pre-shimmer" style="width: 70%; height: 30px; border-radius: 8px;"></div>
                <div class="pre-shimmer" style="width: 90%; height: 22px; border-radius: 6px; margin-top: 4px;"></div>
                <div class="pre-shimmer" style="width: 95%; height: 14px; border-radius: 4px; margin-top: 12px;"></div>
                <div class="pre-shimmer" style="width: 75%; height: 14px; border-radius: 4px;"></div>
              </div>

              <!-- Center Weather Widget Card -->
              <div class="pre-weather-card">
                <div class="weather-top">
                  <span class="weather-temp">23°</span>
                  <div class="weather-icon-circle"></div>
                </div>
                <div class="weather-meta">
                  <span>H:30° L:20° · Bengaluru, India</span>
                  <span>Sunny</span>
                </div>
              </div>

              <!-- Right 3 KPI Cards -->
              <div class="pre-kpi-grid">
                <div class="pre-kpi-card">
                  <div class="kpi-circle pre-shimmer"></div>
                  <div class="kpi-text-col">
                    <div class="pre-shimmer" style="width: 60%; height: 13px;"></div>
                    <div class="pre-shimmer" style="width: 85%; height: 16px;"></div>
                  </div>
                </div>
                <div class="pre-kpi-card">
                  <div class="kpi-circle pre-shimmer"></div>
                  <div class="kpi-text-col">
                    <div class="pre-shimmer" style="width: 55%; height: 13px;"></div>
                    <div class="pre-shimmer" style="width: 80%; height: 16px;"></div>
                  </div>
                </div>
                <div class="pre-kpi-card">
                  <div class="kpi-circle pre-shimmer"></div>
                  <div class="kpi-text-col">
                    <div class="pre-shimmer" style="width: 65%; height: 13px;"></div>
                    <div class="pre-shimmer" style="width: 75%; height: 16px;"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 2. Bento Grid Row -->
            <div class="pre-bento-row">
              <!-- Left Chart Card -->
              <div class="pre-bento-card">
                <div class="pre-card-header">
                  <div class="pre-shimmer" style="width: 180px; height: 18px;"></div>
                  <div class="pre-shimmer" style="width: 80px; height: 26px; border-radius: 999px;"></div>
                </div>
                <div class="pre-chart-mock">
                  <div class="pre-chart-col pre-shimmer" style="height: 45%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 65%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 80%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 55%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 90%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 75%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 85%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 100%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 70%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 88%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 92%;"></div>
                  <div class="pre-chart-col pre-shimmer" style="height: 98%;"></div>
                </div>
              </div>

              <!-- Right Operations / Task Card -->
              <div class="pre-bento-card">
                <div class="pre-card-header">
                  <div class="pre-shimmer" style="width: 150px; height: 18px;"></div>
                  <div class="pre-shimmer" style="width: 70px; height: 24px; border-radius: 999px;"></div>
                </div>
                <div class="pre-shimmer" style="width: 100%; height: 50px; border-radius: 10px;"></div>
                <div class="pre-shimmer" style="width: 100%; height: 50px; border-radius: 10px;"></div>
              </div>
            </div>

            <!-- 3. Tabular Records Card -->
            <div class="pre-table-card">
              <div class="pre-card-header">
                <div class="pre-shimmer" style="width: 200px; height: 18px;"></div>
                <div class="pre-shimmer" style="width: 100px; height: 28px; border-radius: 8px;"></div>
              </div>
              <div class="pre-table-row">
                <div class="pre-shimmer" style="width: 15%; height: 14px;"></div>
                <div class="pre-shimmer" style="width: 30%; height: 14px;"></div>
                <div class="pre-shimmer" style="width: 20%; height: 14px;"></div>
                <div class="pre-shimmer" style="width: 15%; height: 18px; border-radius: 999px;"></div>
              </div>
              <div class="pre-table-row">
                <div class="pre-shimmer" style="width: 18%; height: 14px;"></div>
                <div class="pre-shimmer" style="width: 28%; height: 14px;"></div>
                <div class="pre-shimmer" style="width: 22%; height: 14px;"></div>
                <div class="pre-shimmer" style="width: 15%; height: 18px; border-radius: 999px;"></div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <!-- Live Client Hydration Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
